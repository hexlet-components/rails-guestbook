# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: db/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: db/test.sqlite3

# solid_cache, solid_queue и solid_cable держат свои таблицы в отдельных
# конфигурациях подключения. Здесь все четыре указывают на один и тот же
# DATABASE_URL: у сервиса выката база одна, а разные migrations_paths дают
# каждому набору таблиц свою схему внутри неё.
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate

staging:
  primary: &primary_staging
    <<: *default
    database: db/staging.sqlite3
  cache:
    <<: *primary_staging
    database: db/staging_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_staging
    database: db/staging_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_staging
    database: db/staging_cable.sqlite3
    migrations_paths: db/cable_migrate
