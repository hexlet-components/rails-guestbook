# Omakase Ruby styling for Rails: стиль, который Rails ставит по умолчанию.
# Правила руками не выбираются и руками не правятся.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# inherit_mode у omakase сливает Exclude, а не заменяет его.
AllCops:
  Exclude:
    - "db/*schema.rb"
    - "db/migrate/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
    - "bin/**/*"
