---
name: Render

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup идёт до setup-node: при `cache: pnpm` setup-node ищет
      # уже установленный бинарь pnpm, чтобы вычислить путь к store.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - run: pnpm install --frozen-lockfile

      - run: make setup

      - run: make lint

      - run: make test

